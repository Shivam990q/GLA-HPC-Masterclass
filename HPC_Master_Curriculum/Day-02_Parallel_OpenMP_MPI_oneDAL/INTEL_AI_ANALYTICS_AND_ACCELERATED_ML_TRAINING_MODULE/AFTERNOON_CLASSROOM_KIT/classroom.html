let idx = 0;
const menu = document.getElementById("menu");
MODULES.forEach((m, i) => {
  if (i === 0 || MODULES[i-1].topic !== m.topic) {
    const h = document.createElement("div");
    h.className = "topic";
    h.textContent = m.topic === "A"
      ? "Topic A · AI Analytics Toolkit (NumPy, Pandas, sklearn)"
      : "Topic B · Intel Extension for Scikit-learn";
    menu.appendChild(h);
  }
  const b = document.createElement("button");
  b.className = "mod";
  b.innerHTML = `<b>${m.id}</b> ${m.title}<small>${m.time}</small>`;
  b.onclick = () => { idx = i; render(); };
  menu.appendChild(b);
});

function render() {
  const m = MODULES[idx];
  document.getElementById("hdr").textContent = `Topic ${m.topic} · Module ${m.id} · ${m.time}`;
  document.getElementById("pos").textContent = `${idx+1} / ${MODULES.length}`;
  document.getElementById("cues").innerHTML = m.cues.map(c =>
    `<span class="badge ${c.k}">${c.t}</span>`).join("");
  document.getElementById("board").innerHTML = m.html();
  [...menu.querySelectorAll(".mod")].forEach((el, i) => el.classList.toggle("on", i === idx));
  if (m.id === "A2") buildCores();
  if (m.id === "A5") simd(64);
  if (m.id === "B7") { pulseI = 0; pulseNext(); }
}
function go(d) {
  idx = Math.max(0, Math.min(MODULES.length-1, idx+d));
  render();
  document.querySelector("main").scrollTop = 0;
}
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") go(1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1);
});

function buildCores() {
  const a = document.getElementById("gilA");
  const b = document.getElementById("gilB");
  if (!a) return;
  a.innerHTML = b.innerHTML = "";
  for (let i=0;i<64;i++) {
    a.innerHTML += `<div class="core" id="ga${i}">${i+1}</div>`;
    b.innerHTML += `<div class="core" id="gb${i}">${i+1}</div>`;
  }
}
function gilPlay() {
  buildCores();
  document.getElementById("ga0").classList.add("busy");
  document.getElementById("gilL1").textContent = "Core 1 busy. 63 idle. GIL locked.";
  setTimeout(() => { for (let i=0;i<64;i++) document.getElementById("gb"+i).classList.add("work"); }, 600);
}
function packNumpy() {
  const lane = document.getElementById("npLane");
  lane.innerHTML = "";
  for (let i=0;i<16;i++) lane.innerHTML += `<div class="cell">${i+1}</div>`;
  document.getElementById("npTxt").textContent = "16 float32 in one 64-byte burst. This is Optimized NumPy.";
}
function kit(k) {
  const map = {
    n: "<b>NumPy → Intel oneMKL.</b> <code>np.dot</code>, SVD, GEMM. Cache blocking + FMA. Command: <code>numpy.show_config()</code>.",
    p: "<b>Pandas → Intel Distribution of Modin.</b> <code>import modin.pandas as pd</code>. Same DataFrame API, work split across cores. Mention it; Colab lab is sklearn/NumPy-heavy.",
    s: "<b>Scikit-learn → Intel oneDAL</b> through sklearnex. That is Topic B, next modules."
  };
  document.getElementById("kitBox").innerHTML = map[k];
}
function simd(v) {
  v = +v;
  const f32 = v/32, f64 = v/64;
  const names = {64:"Scalar",128:"SSE",192:"SSE+",256:"AVX2",320:"AVX2+",384:"wide",448:"wide",512:"AVX-512"};
  const t = document.getElementById("simdT");
  const l = document.getElementById("simdL");
  if (!t) return;
  t.textContent = `${v}-bit register · ${f64} float64 or ${f32} float32 · ${names[v]||""}`;
  l.innerHTML = "";
  for (let i=0;i<f32;i++) l.innerHTML += `<div class="cell">${i+1}</div>`;
}
function patchAnim() {
  const p1 = document.getElementById("p1");
  const p2 = document.getElementById("p2");
  p1.textContent = "patch_sklearn() rewrites sys.modules";
  p1.className = "node b";
  setTimeout(() => { p2.textContent = "oneDAL C++ + OpenMP + AVX-512"; p2.className = "node g"; }, 650);
}
function fam(btn, text) {
  document.getElementById("famOut").textContent = text;
  btn.classList.add("ok");
}
function lab(n, el) {
  document.querySelectorAll(".labcard").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
  const tips = {
    1: "Lab 1: they must print sklearnex version and NumPy config. If MKL is missing, say: speedup may be smaller on this VM; parity still required.",
    2: "Lab 2: patch only KMeans. Ask inertia delta. Fail if they patched after import.",
    3: "Lab 3: 3% fraud. Ask fit seconds and ROC-AUC of both runs.",
    4: "Lab 4: explained_variance_ratio_ should almost match.",
    5: "Lab 5: KMeans/PCA module contains sklearnex or daal4py; RandomForest still sklearn.ensemble.",
    6: "Lab 6: same Pipeline API. Ask queries/sec if they have it."
  };
  document.getElementById("labOut").textContent = tips[n];
}
function mark(btn, ok) {
  btn.classList.add(ok ? "ok" : "bad");
  const why = btn.parentElement.querySelector(".why");
  if (why) why.classList.add("show");
}
const PULSE = [
  {q:"Minimum code to accelerate sklearn?", a:["Rewrite estimators","patch_sklearn() before imports","icx compile","fit_accelerated()"], k:1},
  {q:"Pandas accelerator in the toolkit?", a:["Modin","IPEX","Horovod","OpenVINO"], k:0},
  {q:"oneDAL vs oneDNN?", a:["Same library","oneDAL=classical ML, oneDNN=deep learning","oneDAL is GPU only","oneDNN is Day 2"], k:1},
  {q:"AVX-512 float64 count?", a:["2","4","8","16"], k:2},
  {q:"Not accelerated?", a:["PCA","RandomForest","SVC","BayesianGaussianMixture"], k:3}
];
let pulseI = 0;
function pulseNext() {
  const boxQ = document.getElementById("pulseQ");
  const boxA = document.getElementById("pulseA");
  if (!boxQ) return;
  if (pulseI >= PULSE.length) { boxQ.textContent = "Pulse done. Open the 20-Q quiz."; boxA.innerHTML=""; return; }
  const p = PULSE[pulseI++];
  boxQ.textContent = "Pulse "+pulseI+": "+p.q;
  boxA.innerHTML = p.a.map((t,i)=>`<button class="chip" onclick="mark(this,${i===p.k})">${"ABCD"[i]}. ${t}</button>`).join("");
}

render();
</script>
